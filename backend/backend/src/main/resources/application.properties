spring.application.name=backend
server.port=8080

# PostgreSQL
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/hoakhanh_rental}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Thu muc luu anh phong
app.upload-dir=${UPLOAD_DIR:uploads/rooms}

# Gioi han dung luong upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB
