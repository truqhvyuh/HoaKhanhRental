spring.application.name=backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/hoakhanh_rental
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Thu muc luu anh phong
app.upload-dir=D:/VSCodeFile/HoaKhanhRental/uploads/rooms

# Gioi han dung luong upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=26MB